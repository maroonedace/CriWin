[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# errors, pyflakes, import-sorting, warnings, pyupgrade, flake8-bugbear
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection helpers are meant to be called in defaults (B008).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
]
