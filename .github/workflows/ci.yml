name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.9.10

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest

    # The repository and migration tests run against a real database: the schema uses
    # a Postgres BIGINT[] and ON CONFLICT, neither of which SQLite can stand in for.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: criwin
          POSTGRES_PASSWORD: criwin
          POSTGRES_DB: criwin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U criwin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://criwin:criwin@localhost:5432/criwin_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Actions sets CI=true, which makes the database fixtures fail rather than skip.
      - name: Run tests
        run: |
          python -m pytest -v \
            --cov=src --cov-report=term-missing \
            --junitxml=junit.xml

      - name: Publish test report
        if: always()
        run: python .github/scripts/junit_summary.py junit.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: junit.xml
