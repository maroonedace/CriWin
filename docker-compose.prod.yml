# Production overrides (Debian server).
#
# Passed explicitly so the dev override is NOT auto-merged:
#   docker compose --env-file .env.prod \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The base file is already prod-safe (code baked into the image, no source mounts,
# admin bound to loopback, caches on named volumes). This overlay only adds disk/log
# tuning that dev doesn't need. The image is built on the server (`--build`).
services:
  db:
    logging: &prod-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  storage:
    logging: *prod-logging

  admin:
    logging: *prod-logging
