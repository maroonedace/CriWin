# Development overrides (macOS / Windows / Linux).
#
# Auto-merged on top of docker-compose.yml by `docker compose up`. Adds live source
# mounts and loopback debug ports. NOT loaded when the prod file is passed explicitly
# with -f, so these conveniences never reach production.
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"   # attach a local SQL client

  storage:
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # MinIO console (browser)

  app:
    environment:
      ENVIRONMENT: dev
      # Don't scatter root-owned __pycache__ into the bind-mounted ./src on Linux hosts.
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./src:/criwin/src
      - ./main.py:/criwin/main.py

  admin:
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./src:/criwin/src
