# Alembic configuration. See alembic/env.py for the connection and metadata wiring.

[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
path_separator = os

# Prepend the repo root to sys.path so env.py can `import src.config`.
prepend_sys_path = .

# sqlalchemy.url is deliberately absent. env.py builds the URL from src.config.Config,
# so the connection settings have one source of truth and a password containing '%'
# cannot be mangled by ConfigParser's interpolation.


# Logging configuration, consumed by env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
